<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trend Detective</title>
  <meta name="description" content="Fix the value, watch the place move. Investigate 46 years of NASA MERRA-2 climate data: trends, significance, and how climate zones travel across the planet." />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='13' r='8.5' fill='none' stroke='%23ff8a3d' stroke-width='3'/%3E%3Cpath d='M19.5 19.5l7 7' stroke='%23ff8a3d' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M8.5 15c2-4 5-5 9-4' stroke='%234cc9ff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
        "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
      }
    }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="ink" x="-10%" y="-20%" width="120%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feComponentTransfer in="n" result="speck"><feFuncA type="discrete" tableValues="0 0 0 1 1" /></feComponentTransfer>
        <feComposite in="d" in2="speck" operator="out" />
      </filter>
    </defs>
  </svg>

  <div id="app" class="app" data-mode="series" data-view="landing">
    <header class="topbar">
      <button class="btn small drawer-btn" id="drawerBtn" title="Questions and settings">☰ Question</button>
      <button class="brand" id="brandBtn" title="Back to the start">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><circle cx="13" cy="13" r="8.5" /><path d="M19.5 19.5l7 7" class="handle" /><path d="M8.5 15c2-4 5-5 9-4" class="trace" /></svg>
        <span class="brand-name">Trend<b>Detective</b></span>
      </button>
      <nav class="modes" id="modeTabs" aria-label="Investigation modes"></nav>
      <div class="top-actions">
        <button class="btn ghost" id="casesBtn"><span class="dot live"></span>Watch a case</button>
        <button class="btn ghost icon" id="aboutBtn" title="Methods, data and credits">?</button>
      </div>
    </header>

    <aside class="panel left" id="leftPanel" aria-label="The question"></aside>

    <main class="stage" id="stage">
      <div class="map" id="map">
        <canvas id="glCanvas" class="layer"></canvas>
        <canvas id="particleCanvas" class="layer"></canvas>
        <canvas id="overlayCanvas" class="layer"></canvas>
        <div class="map-hud tl" id="hudTitle"></div>
        <div class="map-hud tr" id="hudTools"></div>
        <div class="map-hud bl" id="hudLegend"></div>
        <div class="map-hud br" id="hudData"></div>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="map-toast" id="mapToast" hidden></div>
        <div class="loader" id="loader" hidden>
          <div class="loader-ring"></div>
          <div class="loader-text" id="loaderText">Loading NASA data…</div>
          <div class="loader-bar"><i id="loaderBar"></i></div>
        </div>
      </div>
      <div class="sheet" id="sheet" hidden></div>
      <div class="caseplayer" id="casePlayer" hidden></div>
      <div class="timeline" id="timeline"></div>
    </main>

    <aside class="panel right" id="rightPanel" aria-label="The evidence"></aside>

    <section class="landing" id="landing" aria-label="Welcome"></section>
    <div class="modal" id="aboutModal" hidden></div>
    <footer class="footnote">Code and text written with Claude and reviewed by the team · Data: NASA MERRA-2 (GMAO, GES DISC) · Not affiliated with NASA</footer>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
