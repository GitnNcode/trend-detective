<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trend Detective</title>
  <meta name="description" content="Fix the value, watch the place move. 46 years of NASA MERRA-2 data: trends, significance, and how climate zones travel." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Cpath d='M1 11c3-4 5-4 7-2s4 2 7-2' stroke='%23ffd400' stroke-width='1.6' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
    {
      "imports": {
        "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
        "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="app" class="wx" data-mode="band">
    <header class="menubar" id="menubar"></header>
    <div class="toolbar" id="toolbar"></div>
    <main class="workspace">
      <section class="display" id="display">
        <div class="figtitle" id="figTitle"></div>
        <div class="map" id="map">
          <canvas id="glCanvas" class="layer"></canvas>
          <canvas id="overlayCanvas" class="layer"></canvas>
          <div class="loader" id="loader" hidden><span id="loaderText">Loading</span><i><b id="loaderBar"></b></i></div>
          <div class="toast" id="toast" hidden></div>
          <div class="sheet" id="sheet" hidden></div>
        </div>
        <div class="colorbar" id="colorbar"></div>
      </section>
      <aside class="inspector" id="inspector"></aside>
    </main>
    <div class="caption" id="caption" hidden></div>
    <footer class="statusbar" id="statusbar"></footer>
    <div class="modal" id="aboutModal" hidden></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
